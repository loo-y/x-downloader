[project]
name = "x-downloader"
version = "0.3.1"
description = "Structured download library and CLI for X/Twitter, YouTube, and MissAV via yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp==2026.8.19",
  "yt-dlp-ejs==0.8.0",
  "websocket-client==1.8.0",
]

[project.optional-dependencies]
dev = ["build>=1.2.2", "pytest>=8.4.1"]

[project.scripts]
xdl = "x_downloader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
